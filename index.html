<html>
<head>
  <title>Websim Messenger</title>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      height: calc(100vh - 40px);
    }

    .users-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
    }

    .chat-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 8px;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .user-item:hover {
      background: #f0f0f0;
    }

    .user-item.active {
      background: #e3f2fd;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .messages-container {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 10px;
    }

    .message {
      margin-bottom: 10px;
      max-width: 80%;
    }

    .message.sent {
      margin-left: auto;
    }

    .message-content {
      padding: 8px 12px;
      border-radius: 12px;
      display: inline-block;
      max-width: 100%;
      word-wrap: break-word;
    }

    .message.received .message-content {
      background: #f0f0f0;
    }

    .message.sent .message-content {
      background: #0084ff;
      color: white;
    }

    .message-info {
      font-size: 12px;
      color: #666;
      margin: 2px 0;
    }

    .message-input {
      display: flex;
      gap: 10px;
    }

    .message-input input {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
    }

    .message-input button {
      padding: 8px 16px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .message-input button:hover {
      background: #0073e6;
    }

    .header {
      margin-bottom: 20px;
    }

    .disclaimer {
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      margin-bottom: 15px;
      color: #856404;
    }

    .no-chat {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-style: italic;
    }

    .chat-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    .chat-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="users-panel">
      <div class="header">
        <h2>Active Users</h2>
      </div>
      <div class="disclaimer">
        Note: All messages are public and visible to everyone on Websim
      </div>
      <div id="users-list"></div>
    </div>
    
    <div class="chat-panel" id="chat-panel">
      <div id="no-chat" class="no-chat">
        Select a user to start chatting
      </div>
      <div id="chat-view" style="display: none; height: 100%;">
        <div id="chat-header" class="chat-header"></div>
        <div class="messages-container" id="messages-container"></div>
        <div class="message-input">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button id="send-button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="messenger.js"></script>

</body>
</html>
