<html>
<head>
  <title>Websim Messenger</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      height: calc(100vh - 20px);
    }

    .users-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      background: white;
      height: 100%;
      box-sizing: border-box;
    }

    .chat-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      background: white;
      height: 100%;
      box-sizing: border-box;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 8px;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .user-item:hover {
      background: #f0f0f0;
    }

    .user-item.active {
      background: #e3f2fd;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .messages-container {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .message {
      margin-bottom: 10px;
      max-width: 80%;
    }

    .message.sent {
      margin-left: auto;
    }

    .message-content {
      padding: 8px 12px;
      border-radius: 12px;
      display: inline-block;
      max-width: 100%;
      word-wrap: break-word;
    }

    .message.received .message-content {
      background: #f0f0f0;
    }

    .message.sent .message-content {
      background: #0084ff;
      color: white;
    }

    .message-info {
      font-size: 12px;
      color: #666;
      margin: 2px 0;
    }

    .message-input {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .message-input input {
      flex-grow: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 16px;
    }

    .message-input button {
      padding: 8px 20px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .message-input button:hover {
      background: #0073e6;
    }

    .message-input button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      margin: 0;
    }

    .disclaimer {
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      margin-bottom: 15px;
      color: #856404;
      font-size: 14px;
    }

    .no-chat {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-style: italic;
      text-align: center;
      padding: 20px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    .chat-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .chat-header h3 {
      margin: 0;
    }

    .back-button {
      display: none;
      padding: 8px 12px;
      background: #f0f0f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }

    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      .container {
        grid-template-columns: 1fr;
        height: 100vh;
        gap: 0;
      }

      .users-panel {
        border: none;
        border-radius: 0;
        display: block;
      }

      .chat-panel {
        border: none;
        border-radius: 0;
        display: none;
        height: 100vh;
      }

      .chat-panel.active {
        display: flex;
      }

      .back-button {
        display: block;
      }

      .message-input {
        padding: 10px;
        background: white;
        border-top: 1px solid #eee;
      }

      .messages-container {
        padding-bottom: 20px;
      }
    }

    .typing-indicator {
      display: none;
      padding: 8px;
      color: #666;
      font-style: italic;
      font-size: 14px;
    }

    .user-count {
      background: #f0f0f0;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      color: #666;
    }

    .empty-state {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="users-panel" id="users-panel">
      <div class="header">
        <h2>Active Users</h2>
        <div class="user-count" id="user-count">0 online</div>
      </div>
      <div class="disclaimer">
        Note: All messages are public and visible to everyone on Websim
      </div>
      <div id="users-list">
        <div class="empty-state">Waiting for other users to join...</div>
      </div>
    </div>
    
    <div class="chat-panel" id="chat-panel">
      <div id="no-chat" class="no-chat">
        Select a user to start chatting
      </div>
      <div id="chat-view" style="display: none; height: 100%;">
        <div id="chat-header" class="chat-header">
          <button class="back-button" id="back-button">←</button>
        </div>
        <div class="messages-container" id="messages-container"></div>
        <div class="typing-indicator" id="typing-indicator"></div>
        <div class="message-input">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button id="send-button" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="messenger.js"></script>

</html>
